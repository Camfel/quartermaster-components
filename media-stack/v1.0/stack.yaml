# Quartermaster Media Stack component — v1.0
#
# Full Arr suite + Jellyfin for automated TV and movie downloads.
# Torrent and indexer traffic routed through VPN (requires `qm enable vpn`).
#
# Services: qBittorrent → Prowlarr → Sonarr/Radarr → Jellyfin
version: "1"
kind: Stack
metadata:
  name: qm-media-stack
spec:
  services:
    - name: qbittorrent
      image: lscr.io/linuxserver/qbittorrent:latest
      restart_policy: unless-stopped
      network: vpn
      depends_on:
        - gluetun
      ports:
        - host: 8080
          container: 8080
        - host: 6881
          container: 6881
          protocol: tcp
        - host: 6881
          container: 6881
          protocol: udp
      volumes:
        - source: /mnt/downloads
          target: /downloads
          type: bind
        - source: /opt/qbittorrent/config
          target: /config
          type: bind
      env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/Chicago"
        - name: WEBUI_PORT
          value: "8080"

    - name: prowlarr
      image: lscr.io/linuxserver/prowlarr:latest
      restart_policy: unless-stopped
      network: vpn
      depends_on:
        - gluetun
        - qbittorrent
      ports:
        - host: 9696
          container: 9696
      volumes:
        - source: /opt/prowlarr/config
          target: /config
          type: bind
      env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/Chicago"

    - name: sonarr
      image: lscr.io/linuxserver/sonarr:latest
      restart_policy: unless-stopped
      depends_on:
        - prowlarr
        - qbittorrent
      ports:
        - host: 8989
          container: 8989
      volumes:
        - source: /mnt/media/tv
          target: /tv
          type: bind
        - source: /mnt/downloads
          target: /downloads
          type: bind
        - source: /opt/sonarr/config
          target: /config
          type: bind
      env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/Chicago"
      network: public

    - name: radarr
      image: lscr.io/linuxserver/radarr:latest
      restart_policy: unless-stopped
      depends_on:
        - prowlarr
        - qbittorrent
      ports:
        - host: 7878
          container: 7878
      volumes:
        - source: /mnt/media/movies
          target: /movies
          type: bind
        - source: /mnt/downloads
          target: /downloads
          type: bind
        - source: /opt/radarr/config
          target: /config
          type: bind
      env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/Chicago"
      network: public

    - name: jellyfin
      image: lscr.io/linuxserver/jellyfin:latest
      restart_policy: unless-stopped
      depends_on:
        - sonarr
        - radarr
      ports:
        - host: 8096
          container: 8096
        - host: 8920
          container: 8920
      volumes:
        - source: /mnt/media/tv
          target: /data/tvshows
          type: bind
        - source: /mnt/media/movies
          target: /data/movies
          type: bind
        - source: /opt/jellyfin/config
          target: /config
          type: bind
      env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/Chicago"
      resources:
        gpu:
          type: nvidia
          id: all
      network: public
      healthcheck:
        type: http
        path: /health
        port: 8096
        interval: 30s
