version: "1"
kind: Stack
metadata:
  name: media-stack
spec:
  services:
    # ── Usenet Downloader (VPN) ────────────────────────────────────
    - name: sabnzbd
      image: lscr.io/linuxserver/sabnzbd:latest
      restart_policy: unless-stopped
      network: vpn
      depends_on:
        - gluetun
      ports:
        - host: 8080
          container: 8080
      volumes:
        - source: /mnt/downloads
          target: /downloads
          type: bind
        - source: /opt/sabnzbd/config
          target: /config
          type: bind
      env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Australia/Sydney"
      healthcheck:
        type: http
        path: /api?mode=version
        port: 8080
        interval: 30s
      log:
        enabled: true
        max_size: "50MB"
        max_files: 5

    # ── Indexer Manager (VPN) ──────────────────────────────────────
    - name: prowlarr
      image: lscr.io/linuxserver/prowlarr:latest
      restart_policy: unless-stopped
      network: vpn
      depends_on:
        - gluetun
        - sabnzbd
      ports:
        - host: 9696
          container: 9696
      volumes:
        - source: /opt/prowlarr/config
          target: /config
          type: bind
      env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Australia/Sydney"
      healthcheck:
        type: tcp
        port: 9696
        interval: 30s

    # ── TV Series Automation ───────────────────────────────────────
    - name: sonarr
      image: lscr.io/linuxserver/sonarr:latest
      restart_policy: unless-stopped
      depends_on:
        - prowlarr
        - sabnzbd
      ports:
        - host: 8989
          container: 8989
      volumes:
        - source: /mnt/media/tv
          target: /tv
          type: bind
        - source: /mnt/downloads
          target: /downloads
          type: bind
        - source: /opt/sonarr/config
          target: /config
          type: bind
        - source: /opt/sonarr/config/resolv.conf
          target: /etc/resolv.conf
          type: bind
      env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Australia/Sydney"
      network: public
      healthcheck:
        type: http
        path: /ping
        port: 8989
        interval: 30s

    # ── Movie Automation ───────────────────────────────────────────
    - name: radarr
      image: lscr.io/linuxserver/radarr:latest
      restart_policy: unless-stopped
      depends_on:
        - prowlarr
        - sabnzbd
      ports:
        - host: 7878
          container: 7878
      volumes:
        - source: /mnt/media/movies
          target: /movies
          type: bind
        - source: /mnt/downloads
          target: /downloads
          type: bind
        - source: /opt/radarr/config
          target: /config
          type: bind
        - source: /opt/radarr/config/resolv.conf
          target: /etc/resolv.conf
          type: bind
      env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Australia/Sydney"
      network: public
      healthcheck:
        type: http
        path: /ping
        port: 7878
        interval: 30s

    # ── Cloudflare Bypass ──────────────────────────────────────────
    - name: flaresolverr
      image: ghcr.io/flaresolverr/flaresolverr:latest
      restart_policy: unless-stopped
      network: vpn
      ports:
        - host: 8191
          container: 8191
      env:
        - name: LOG_LEVEL
          value: info
      healthcheck:
        type: http
        path: /
        port: 8191
        interval: 30s

    # ── Request Management ─────────────────────────────────────────
    - name: jellyseerr
      image: ghcr.io/seerr-team/seerr:latest
      restart_policy: unless-stopped
      network: public
      depends_on:
        - sonarr
        - radarr
      ports:
        - host: 5055
          container: 5055
      ingress:
        host: requests
        port: 5055
        auth: false
      volumes:
        - source: /opt/jellyseerr/config
          target: /app/config
          type: bind
        - source: /opt/jellyseerr/config/resolv.conf
          target: /etc/resolv.conf
          type: bind
      env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Australia/Sydney"
      healthcheck:
        type: http
        path: /
        port: 5055
        interval: 30s
      log:
        enabled: true
        max_size: "50MB"
        max_files: 5

    # ── Media Server ───────────────────────────────────────────────
    - name: jellyfin
      image: lscr.io/linuxserver/jellyfin:latest
      restart_policy: unless-stopped
      network: public
      ports:
        - host: 8096
          container: 8096
        - host: 8920
          container: 8920
      resources:
        gpu:
          type: nvidia
          id: all
      depends_on:
        - sonarr
        - radarr
      ingress:
        host: media
        port: 8096
        auth: false
      volumes:
        - source: /mnt/media/tv
          target: /data/tvshows
          type: bind
        - source: /mnt/media/movies
          target: /data/movies
          type: bind
        - source: /opt/jellyfin/config
          target: /config
          type: bind
        - source: /opt/jellyfin/config/resolv.conf
          target: /etc/resolv.conf
          type: bind
      env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Australia/Sydney"
      healthcheck:
        type: http
        path: /health
        port: 8096
        interval: 30s
      log:
        enabled: true
        max_size: "100MB"
        max_files: 5
