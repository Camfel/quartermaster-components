# Quartermaster Dashboard component — v1.0
#
# Web GUI for monitoring services, health, and watchers.
# Connects to the daemon status socket for live data.
#
# To enable:
#   qm enable dashboard
version: "1"
kind: Stack
metadata:
  name: qm-dashboard
spec:
  services:
    - name: dashboard
      image: ghcr.io/camfel/quartermaster-gui:v0.2.0
      restart_policy: unless-stopped
      ports:
        - host: 8090
          container: 8090
      volumes:
        - source: /run/quartermaster/daemon.sock
          target: /run/quartermaster/daemon.sock
          type: bind
      user: "999:989"
      network: public
