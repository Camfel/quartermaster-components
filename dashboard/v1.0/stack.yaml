# Quartermaster Dashboard component — v1.0
#
# Web GUI for monitoring services, health, and watchers.
# Connects to the daemon status socket for live data.
#
# To enable:
#   qm enable dashboard
#
# Optional: add ingress in your config repo to expose it:
#   ingress:
#     host: dash
#     port: 8090
#     auth: true

version: "1"
kind: Stack
metadata:
  name: qm-dashboard

spec:
  services:
    - name: dashboard
      image: ghcr.io/camfel/quartermaster-gui:latest
      restart_policy: unless-stopped
      network: public
      ports:
        - host: 8090
          container: 8090
      volumes:
        - source: /run/quartermaster
          target: /run/quartermaster
          type: bind
      user: "999:989"
      healthcheck:
        type: http
        path: /
        port: 8090
        interval: 30s
