# Quartermaster VPN component — v1.0
#
# VPN gateway via Gluetun.  Services with network: vpn and
# depends_on: [gluetun] route all traffic through the VPN.
#
# Defaults to ProtonVPN OpenVPN — works immediately after:
#   echo -n 'your-user' | qm secret create vpn-user
#   echo -n 'your-pass' | qm secret create vpn-pass
#   qm enable vpn
#
# Customise via ConfigMap in your config repo:
#   qm configmap set vpn-config provider=mullvad type=wireguard

version: "1"
kind: Stack
metadata:
  name: qm-vpn

spec:
  services:
    - name: gluetun
      image: docker.io/qmcgaw/gluetun:latest
      network: vpn
      restart_policy: always
      env:
        - name: VPN_SERVICE_PROVIDER
          value: protonvpn
          valueFrom:
            configMapRef: vpn-config
            key: provider
        - name: VPN_TYPE
          value: openvpn
          valueFrom:
            configMapRef: vpn-config
            key: type
        - name: SERVER_REGIONS
          valueFrom:
            configMapRef: vpn-config
            key: server_regions
        - name: FIREWALL
          value: "off"
          valueFrom:
            configMapRef: vpn-config
            key: firewall
        - name: OPENVPN_USER_SECRETFILE
          value: /run/secrets/vpn-user
        - name: OPENVPN_PASSWORD_SECRETFILE
          value: /run/secrets/vpn-pass
      secrets:
        - name: vpn-user
          secret_ref: vpn-user
        - name: vpn-pass
          secret_ref: vpn-pass
      healthcheck:
        type: tcp
        port: 8000
        interval: 30s
